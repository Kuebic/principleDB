# principleDB — Fly.io deploy config (issue #51, ADR-0016).
#
# Fly is the recommended always-on host: shared-cpu-1x + managed TLS/anycast +
# Dockerfile deploy is ~$3-4/mo, which is the smallest lift that satisfies
# #39's "anyone, anytime." The host is reversible — the same Dockerfile runs
# unchanged on Hetzner or an own-box behind a Cloudflare Tunnel (ADR-0016).
#
# Setup steps (documented in SELF_HOSTING.md §8):
#   1. flyctl launch --no-deploy   # or `flyctl apps create <name>` if this
#                                  # file already exists; edit `app` below.
#   2. flyctl secrets set DATABASE_URL=… ANTHROPIC_API_KEY=… OPENAI_API_KEY=…
#      (plus optional R2_* if you host PDFs; the serve surface itself doesn't
#      need them, but the same env feeds the ingest CLIs if you exec into
#      the machine.)
#   3. flyctl deploy
#   4. Put Cloudflare in front of the *.fly.dev hostname and add per-IP
#      rate rules (see SELF_HOSTING.md §8).

app = "principledb"
primary_region = "iad"

[build]
  # Uses the repo-root Dockerfile.

[env]
  # Match Dockerfile defaults; keep them here so `flyctl deploy` env is
  # explicit and any override lands in one place.
  PORT = "3000"
  HOSTNAME = "0.0.0.0"

[http_service]
  internal_port = 3000
  force_https = true
  # Always-on: don't idle the machine to zero. Cold-starts on every hit
  # contradict the ADR-0016 promise; the shared-cpu-1x cost of one machine
  # running 24/7 is the price of that promise.
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    interval = "30s"
    timeout = "5s"
    grace_period = "10s"
    method = "GET"
    # GET / with no `q` renders the empty search page without touching the
    # DB, so it's a cheap "is the process up" probe. Deeper DB checks live
    # in `npm run doctor`.
    path = "/"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
