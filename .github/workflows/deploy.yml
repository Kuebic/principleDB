name: Deploy to Hetzner

# Push to main -> SSH into the box -> git pull && docker compose up -d --build
# in /opt/stacks/principleDB. Build happens on the server, same as the manual step.

on:
  push:
    branches: [main]
  workflow_dispatch: {} # allow manual re-deploy from the Actions tab

concurrency:
  group: deploy-hetzner
  cancel-in-progress: false # never interrupt an in-flight deploy

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.HETZNER_HOST }}
          username: ${{ secrets.HETZNER_USER }}
          key: ${{ secrets.HETZNER_SSH_KEY }}
          port: ${{ secrets.HETZNER_PORT || 22 }}
          script_stop: true # abort on first failed command
          script: |
            set -euo pipefail
            cd /opt/stacks/principleDB
            git fetch --prune origin main
            git reset --hard origin/main
            docker compose up -d --build
            docker image prune -f
